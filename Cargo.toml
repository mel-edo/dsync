[package]
name = "dsync"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
blake3 = "1.8.2"
bincode = "1.3.3"
notify = "8.2.0"
serde = { version = "1.0.219", features = ["derive"] }
anyhow = "1.0.99"
clap = { version = "4.5.48", features = ["derive"] }
pathdiff = "0.2.3"
mdns-sd = "0.11"
hostname = "0.4"
get_if_addrs = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"